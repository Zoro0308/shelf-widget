          </LinearLayout>
          ENDOFFILE

      # ── 19. Layout: activity_app_picker.xml ──────────────────────────────────
      - name: Generate activity_app_picker.xml and item_app.xml
        run: |
          cat > app/src/main/res/layout/activity_app_picker.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/background">

              <EditText
                  android:id="@+id/search_view"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="@string/search_apps"
                  android:imeOptions="actionSearch"
                  android:inputType="text"
                  android:padding="12dp"
                  android:singleLine="true"
                  android:background="@color/surface"/>

              <View
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:background="@color/divider"/>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recycler_view"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:scrollbars="vertical"/>
          </LinearLayout>
          ENDOFFILE

          cat > app/src/main/res/layout/item_app.xml << 'ENDOFFILE2'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="12dp"
              android:gravity="center_vertical"
              android:background="?attr/selectableItemBackground">

              <ImageView
                  android:id="@+id/app_icon"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:contentDescription="@null"/>

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:paddingStart="12dp"
                  android:paddingEnd="4dp">
                  <TextView
                      android:id="@+id/app_name"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="16sp"
                      android:textColor="@color/text_primary"
                      android:maxLines="1"
                      android:ellipsize="end"/>
                  <TextView
                      android:id="@+id/app_package"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="11sp"
                      android:textColor="@color/text_secondary"
                      android:maxLines="1"
                      android:ellipsize="end"/>
              </LinearLayout>
          </LinearLayout>
          ENDOFFILE2

      # ── 20. XML: shelf_widget_info.xml ────────────────────────────────────────
      - name: Generate shelf_widget_info.xml
        run: |
          cat > app/src/main/res/xml/shelf_widget_info.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <!--
            AppWidgetProviderInfo for ShelfWidget.
            Primary target: Xiaomi Pad 8 landscape (targetCellWidth=2, targetCellHeight=4).
            minWidth/minHeight: legacy fallback for launchers that ignore targetCell attributes.
            updatePeriodMillis=0: updates driven by explicit broadcasts from MainActivity.
            configure: MainActivity handles both placement-config and direct app-drawer launch.
          -->
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="160dp"
              android:minHeight="220dp"
              android:targetCellWidth="2"
              android:targetCellHeight="4"
              android:minResizeWidth="100dp"
              android:minResizeHeight="110dp"
              android:maxResizeWidth="800dp"
              android:maxResizeHeight="800dp"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_shelf"
              android:previewLayout="@layout/widget_shelf"
              android:configure="com.example.shelfwidget.MainActivity"/>
          ENDOFFILE

      # ── 21. Values: strings, colors, themes ───────────────────────────────────
      - name: Generate value resources
        run: |
          cat > app/src/main/res/values/strings.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ShelfWidget</string>
              <string name="app_name_full">Shelf Widget Manager</string>
              <string name="no_widgets_hint">No ShelfWidget instances found.\nAdd the widget to your home screen first, then open this app to configure it.</string>
              <string name="apply_button">Apply &amp; Refresh Widget</string>
              <string name="slot_empty_hint">Tap to add</string>
              <string name="slot_missing_app">App not found</string>
              <string name="slot_cleared">Slot cleared</string>
              <string name="widget_updated">Widget updated!</string>
              <string name="pick_app_title">Choose App</string>
              <string name="search_apps">Search apps…</string>
              <string name="long_press_clear">Long-press a slot to clear it</string>
          </resources>
          ENDOFFILE

          cat > app/src/main/res/values/colors.xml << 'ENDOFFILE2'
