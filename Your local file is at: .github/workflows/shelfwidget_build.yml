              <color name="text_primary">#212121</color>
              <color name="text_secondary">#757575</color>
          </resources>
          ENDOFFILE2

          cat > app/src/main/res/values/themes.xml << 'ENDOFFILE3'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ShelfWidget" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:windowBackground">@color/background</item>
              </style>
          </resources>
          ENDOFFILE3

      # ── 22. Drawables + adaptive icon XMLs ───────────────────────────────────
      - name: Generate drawable and mipmap resources
        run: |
          # Slot card background
          cat > app/src/main/res/drawable/slot_card_bg.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/slot_card_bg"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="@color/slot_card_border"/>
          </shape>
          ENDOFFILE

          # Adaptive icon background
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'ENDOFFILE2'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#3F51B5"/>
          </shape>
          ENDOFFILE2

          # Adaptive icon foreground – three white shelf planks
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'ENDOFFILE3'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M18,28 L90,28 Q94,28 94,32 L94,38 Q94,42 90,42 L18,42 Q14,42 14,38 L14,32 Q14,28 18,28Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M18,50 L90,50 Q94,50 94,54 L94,60 Q94,64 90,64 L18,64 Q14,64 14,60 L14,54 Q14,50 18,50Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M18,72 L90,72 Q94,72 94,76 L94,82 Q94,86 90,86 L18,86 Q14,86 14,82 L14,76 Q14,72 18,72Z"/>
          </vector>
          ENDOFFILE3

          # Adaptive icons (mipmap-anydpi-v26)
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ENDOFFILE4'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ENDOFFILE4

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'ENDOFFILE5'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ENDOFFILE5

      # ── 23. Verify generated file tree ────────────────────────────────────────
      - name: Verify project structure
        run: |
          echo "=== Project file tree ==="
          find . -not -path './.git/*' -not -name '*.class' | sort
          echo ""
          echo "=== Kotlin sources ==="
          find app/src/main/kotlin -name '*.kt' | sort
          echo ""
          echo "=== Resources ==="
          find app/src/main/res -type f | sort

      # ── 24. Setup Gradle cache ────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 25. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          echo "=== Starting assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Build finished ==="

      # ── 26. Verify APK exists ─────────────────────────────────────────────────
      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            find app/build -name '*.apk' 2>/dev/null || echo "No APKs found"
            exit 1
          fi
          ls -lh "$APK"
          echo "SUCCESS: APK built at $APK"

      # ── 27. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload ShelfWidget APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfWidget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
