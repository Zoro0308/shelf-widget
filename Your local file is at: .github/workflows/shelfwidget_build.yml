                              android:layout_weight="1" android:orientation="vertical"
                              android:gravity="center" android:padding="6dp" android:layout_marginEnd="3dp"
                              android:background="@drawable/slot_card_bg">
                              <ImageView android:id="@+id/slot_icon_6"
                                  android:layout_width="48dp" android:layout_height="48dp"
                                  android:scaleType="centerCrop" android:visibility="invisible"/>
                              <TextView android:id="@+id/slot_name_6"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:gravity="center" android:maxLines="1" android:ellipsize="end"
                                  android:textSize="10sp" android:textColor="@color/text_primary"
                                  android:text="@string/slot_empty_hint"/>
                          </LinearLayout>
                          <LinearLayout android:id="@+id/slot_card_7"
                              android:layout_width="0dp" android:layout_height="wrap_content"
                              android:layout_weight="1" android:orientation="vertical"
                              android:gravity="center" android:padding="6dp"
                              android:layout_marginStart="3dp" android:layout_marginEnd="3dp"
                              android:background="@drawable/slot_card_bg">
                              <ImageView android:id="@+id/slot_icon_7"
                                  android:layout_width="48dp" android:layout_height="48dp"
                                  android:scaleType="centerCrop" android:visibility="invisible"/>
                              <TextView android:id="@+id/slot_name_7"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:gravity="center" android:maxLines="1" android:ellipsize="end"
                                  android:textSize="10sp" android:textColor="@color/text_primary"
                                  android:text="@string/slot_empty_hint"/>
                          </LinearLayout>
                          <LinearLayout android:id="@+id/slot_card_8"
                              android:layout_width="0dp" android:layout_height="wrap_content"
                              android:layout_weight="1" android:orientation="vertical"
                              android:gravity="center" android:padding="6dp" android:layout_marginStart="3dp"
                              android:background="@drawable/slot_card_bg">
                              <ImageView android:id="@+id/slot_icon_8"
                                  android:layout_width="48dp" android:layout_height="48dp"
                                  android:scaleType="centerCrop" android:visibility="invisible"/>
                              <TextView android:id="@+id/slot_name_8"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:gravity="center" android:maxLines="1" android:ellipsize="end"
                                  android:textSize="10sp" android:textColor="@color/text_primary"
                                  android:text="@string/slot_empty_hint"/>
                          </LinearLayout>
                      </LinearLayout>

                      <!-- Row 4: slots 9-11 -->
                      <LinearLayout android:layout_width="match_parent"
                          android:layout_height="wrap_content" android:orientation="horizontal">
                          <LinearLayout android:id="@+id/slot_card_9"
                              android:layout_width="0dp" android:layout_height="wrap_content"
                              android:layout_weight="1" android:orientation="vertical"
                              android:gravity="center" android:padding="6dp" android:layout_marginEnd="3dp"
                              android:background="@drawable/slot_card_bg">
                              <ImageView android:id="@+id/slot_icon_9"
                                  android:layout_width="48dp" android:layout_height="48dp"
                                  android:scaleType="centerCrop" android:visibility="invisible"/>
                              <TextView android:id="@+id/slot_name_9"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:gravity="center" android:maxLines="1" android:ellipsize="end"
                                  android:textSize="10sp" android:textColor="@color/text_primary"
                                  android:text="@string/slot_empty_hint"/>
                          </LinearLayout>
                          <LinearLayout android:id="@+id/slot_card_10"
                              android:layout_width="0dp" android:layout_height="wrap_content"
                              android:layout_weight="1" android:orientation="vertical"
                              android:gravity="center" android:padding="6dp"
                              android:layout_marginStart="3dp" android:layout_marginEnd="3dp"
                              android:background="@drawable/slot_card_bg">
                              <ImageView android:id="@+id/slot_icon_10"
                                  android:layout_width="48dp" android:layout_height="48dp"
                                  android:scaleType="centerCrop" android:visibility="invisible"/>
                              <TextView android:id="@+id/slot_name_10"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:gravity="center" android:maxLines="1" android:ellipsize="end"
                                  android:textSize="10sp" android:textColor="@color/text_primary"
                                  android:text="@string/slot_empty_hint"/>
                          </LinearLayout>
                          <LinearLayout android:id="@+id/slot_card_11"
                              android:layout_width="0dp" android:layout_height="wrap_content"
                              android:layout_weight="1" android:orientation="vertical"
                              android:gravity="center" android:padding="6dp" android:layout_marginStart="3dp"
                              android:background="@drawable/slot_card_bg">
                              <ImageView android:id="@+id/slot_icon_11"
                                  android:layout_width="48dp" android:layout_height="48dp"
                                  android:scaleType="centerCrop" android:visibility="invisible"/>
