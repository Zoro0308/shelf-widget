      - name: Generate AppPickerActivity.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/AppPickerActivity.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.widget.EditText
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          /**
           * Full-screen searchable launcher-app picker.
           * Package queries run on Dispatchers.IO. The selected package name is
           * returned to MainActivity via setResult / EXTRA_PACKAGE_NAME.
           */
          class AppPickerActivity : AppCompatActivity() {

              companion object {
                  const val EXTRA_PACKAGE_NAME = "com.example.shelfwidget.EXTRA_PACKAGE_NAME"
              }

              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              private lateinit var searchView  : EditText
              private lateinit var recyclerView: RecyclerView
              private lateinit var adapter     : AppPickerAdapter

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_app_picker)
                  supportActionBar?.title = getString(R.string.pick_app_title)
                  supportActionBar?.setDisplayHomeAsUpEnabled(true)

                  searchView   = findViewById(R.id.search_view)
                  recyclerView = findViewById(R.id.recycler_view)

                  adapter = AppPickerAdapter { appInfo ->
                      setResult(RESULT_OK, Intent().apply {
                          putExtra(EXTRA_PACKAGE_NAME, appInfo.packageName)
                      })
                      finish()
                  }
                  recyclerView.layoutManager = LinearLayoutManager(this)
                  recyclerView.adapter       = adapter

                  searchView.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {
                          adapter.filter(s?.toString() ?: "")
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })

                  loadApps()
              }

              override fun onSupportNavigateUp(): Boolean {
                  setResult(RESULT_CANCELED)
                  finish()
                  return true
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }

              private fun loadApps() {
                  scope.launch {
                      val apps = withContext(Dispatchers.IO) {
                          val pm         = packageManager
                          val mainIntent = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_LAUNCHER)
                          }
                          pm.queryIntentActivities(mainIntent, PackageManager.MATCH_ALL)
                              .mapNotNull { ri ->
                                  try {
                                      AppInfo(
                                          name        = ri.loadLabel(pm).toString(),
                                          packageName = ri.activityInfo.packageName,
                                          icon        = ri.loadIcon(pm)
                                      )
                                  } catch (e: Exception) { null }
                              }
                              .distinctBy { it.packageName }
                              .sortedBy   { it.name.lowercase() }
                      }
                      adapter.submitList(apps)
                  }
              }
          }
          ENDOFFILE

