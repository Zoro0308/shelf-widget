      # ── 23. Verify generated file tree ────────────────────────────────────────
      - name: Verify project structure
        run: |
          echo "=== Project file tree ==="
          find . -not -path './.git/*' -not -name '*.class' | sort
          echo ""
          echo "=== Kotlin sources ==="
          find app/src/main/kotlin -name '*.kt' | sort
          echo ""
          echo "=== Resources ==="
          find app/src/main/res -type f | sort

      # ── 24. Setup Gradle cache ────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 25. Build debug APK ───────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          echo "=== Starting assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Build finished ==="

      # ── 26. Verify APK exists ─────────────────────────────────────────────────
      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            find app/build -name '*.apk' 2>/dev/null || echo "No APKs found"
            exit 1
          fi
          ls -lh "$APK"
          echo "SUCCESS: APK built at $APK"

      # ── 27. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload ShelfWidget APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfWidget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
