name: Build ShelfWidget APK

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Project directory structure ────────────────────────────────────────
      - name: Create directory structure
        run: |
          mkdir -p app/src/main/kotlin/com/example/shelfwidget
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

      # ── 4. settings.gradle.kts ────────────────────────────────────────────────
      - name: Generate settings.gradle.kts
        run: |
          cat > settings.gradle.kts << 'ENDOFFILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShelfWidget"
          include(":app")
          ENDOFFILE

      # ── 5. Root build.gradle.kts ──────────────────────────────────────────────
      - name: Generate root build.gradle.kts
        run: |
          cat > build.gradle.kts << 'ENDOFFILE'
          plugins {
              id("com.android.application") version "8.1.4" apply false
              id("org.jetbrains.kotlin.android") version "1.9.21" apply false
          }
          ENDOFFILE

      # ── 6. app/build.gradle.kts ───────────────────────────────────────────────
      - name: Generate app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'ENDOFFILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.shelfwidget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.shelfwidget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  debug {
                      isDebuggable = true
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              sourceSets {
                  getByName("main") {
                      java.srcDirs("src/main/kotlin", "src/main/java")
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.activity:activity-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          ENDOFFILE

      # ── 7. gradle.properties ──────────────────────────────────────────────────
      - name: Generate gradle.properties
        run: |
          cat > gradle.properties << 'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ENDOFFILE

      # ── 8. Bootstrap Gradle 8.4 wrapper ───────────────────────────────────────
      - name: Bootstrap Gradle wrapper
        run: |
          echo "Downloading Gradle 8.4 to generate wrapper files..."
          wget -q "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -O /tmp/gradle-8.4-bin.zip
          unzip -q /tmp/gradle-8.4-bin.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.4/bin/gradle wrapper \
            --gradle-version 8.4 \
            --distribution-type bin
          chmod +x gradlew
          echo "Wrapper ready:"
          ls -lh gradle/wrapper/

      # ── 9. AndroidManifest.xml ────────────────────────────────────────────────
      - name: Generate AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!--
                  Package-visibility: allows discovering installed launchable apps
                  for the app-picker. Fully offline - NO android.permission.INTERNET.
              -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ShelfWidget">

                  <!-- Configuration and Manager Activity -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name_full"
                      android:launchMode="singleTop">
                      <!-- Standard launcher entry point -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <!-- Mandatory AppWidget configure action for launcher placement -->
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE"/>
                      </intent-filter>
                  </activity>

                  <!-- Internal App-picker -->
                  <activity
                      android:name=".AppPickerActivity"
                      android:exported="false"
                      android:label="@string/pick_app_title"/>

                  <!-- Shelf Widget Receiver -->
                  <receiver
                      android:name=".ShelfWidgetProvider"
                      android:exported="true"
                      android:label="ShelfWidget">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/shelf_widget_info"/>
                  </receiver>

              </application>
          </manifest>
          ENDOFFILE

      # ── 10. Kotlin: AppInfo data class ────────────────────────────────────────
      - name: Generate AppInfo.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/AppInfo.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.graphics.drawable.Drawable

          data class AppInfo(
              val name: String,
              val packageName: String,
              val icon: Drawable
          )
          ENDOFFILE

      # ── 11. Kotlin: ShelfPreferences ─────────────────────────────────────────
      - name: Generate ShelfPreferences.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/ShelfPreferences.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.content.Context
          import android.content.SharedPreferences

          /**
           * Independent preferences repository per widget instance and slot index.
           * Keys are strictly partitioned: "w<widgetId>_s<slotIndex>"
           */
          class ShelfPreferences(context: Context) {

              private val prefs: SharedPreferences =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              companion object {
                  private const val PREFS_NAME = "shelf_widget_prefs"
                  private fun key(appWidgetId: Int, slotIndex: Int) =
                      "w${appWidgetId}_s${slotIndex}"
              }

              fun saveAppToSlot(appWidgetId: Int, slotIndex: Int, packageName: String) {
                  prefs.edit().putString(key(appWidgetId, slotIndex), packageName).apply()
              }

              fun getAppForSlot(appWidgetId: Int, slotIndex: Int): String? =
                  prefs.getString(key(appWidgetId, slotIndex), null)

              fun clearSlot(appWidgetId: Int, slotIndex: Int) {
                  prefs.edit().remove(key(appWidgetId, slotIndex)).apply()
              }

              fun getAllSlots(appWidgetId: Int): Map<Int, String> =
                  (0..11).mapNotNull { i ->
                      getAppForSlot(appWidgetId, i)?.let { pkg -> i to pkg }
                  }.toMap()

              fun clearWidget(appWidgetId: Int) {
                  prefs.edit().also { ed ->
                      (0..11).forEach { i -> ed.remove(key(appWidgetId, i)) }
                  }.apply()
              }
          }
          ENDOFFILE

      # ── 12. Kotlin: ShelfCanvasRenderer ──────────────────────────────────────
      - name: Generate ShelfCanvasRenderer.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/ShelfCanvasRenderer.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.graphics.Bitmap
          import android.graphics.BlurMaskFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader

          /**
           * Procedural 2.5-D frosted-glass shelf renderer.
           *
           * Generates four glass shelf planks across the widget canvas.
           * Positions shelves to sit directly underneath the 12 shortcut icon bases.
           */
          object ShelfCanvasRenderer {

              private var cachedBitmap : Bitmap? = null
              private var cacheW       : Int     = 0
              private var cacheH       : Int     = 0
              private var cacheDensity : Float   = 0f

              fun renderShelves(width: Int, height: Int, density: Float): Bitmap {
                  val safeDensity = if (density > 0f) density else 1f
                  val safeW = width.coerceIn(60, 2048)
                  val safeH = height.coerceIn(60, 2048)

                  cachedBitmap?.takeIf {
                      !it.isRecycled &&
                      cacheW == safeW && cacheH == safeH && cacheDensity == safeDensity
                  }?.let { return it }

                  clearCache()

                  val bitmap = Bitmap.createBitmap(safeW, safeH, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)
                  canvas.drawColor(Color.TRANSPARENT)

                  val hMargin = 12f * safeDensity
                  val rowH = safeH / 4f
                  val shelfH = (rowH * 0.22f).coerceIn(12f * safeDensity, 28f * safeDensity)
                  val cornerR = shelfH * 0.45f

                  for (i in 0..3) {
                      val rowBottom = (i + 1) * rowH
                      // Place the shelf plank near the bottom of the row so the icon base sits on it
                      val shelfBottom = rowBottom - (6f * safeDensity)
                      val shelfTop = shelfBottom - shelfH

                      drawShelf(
                          canvas,
                          left = hMargin,
                          top = shelfTop,
                          right = safeW - hMargin,
                          shelfH = shelfH,
                          cornerR = cornerR,
                          density = safeDensity
                      )
                  }

                  cachedBitmap = bitmap
                  cacheW = safeW
                  cacheH = safeH
                  cacheDensity = safeDensity
                  return bitmap
              }

              private fun drawShelf(
                  canvas: Canvas,
                  left: Float, top: Float, right: Float,
                  shelfH: Float, cornerR: Float, density: Float
              ) {
                  val bottom = top + shelfH
                  val rect = RectF(left, top, right, bottom)
                  val blurRadius = (6f * density).coerceAtLeast(1f)

                  // 1. Drop shadow beneath shelf
                  val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      maskFilter = BlurMaskFilter(blurRadius, BlurMaskFilter.Blur.NORMAL)
                      color = Color.argb(90, 10, 20, 45)
                  }
                  canvas.drawRoundRect(
                      RectF(left + 2f * density, top + 4f * density,
                            right - 2f * density, bottom + 5f * density),
                      cornerR, cornerR, shadowPaint
                  )

                  // 2. Frosted glass body with layered vertical gradient
                  val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(
                          left, top, left, bottom,
                          intArrayOf(
                              Color.argb(220, 240, 248, 255),
                              Color.argb(160, 200, 225, 245),
                              Color.argb(180, 215, 235, 252),
                              Color.argb(130, 175, 210, 240)
                          ),
                          floatArrayOf(0f, 0.32f, 0.70f, 1f),
                          Shader.TileMode.CLAMP
                      )
                  }
                  canvas.drawRoundRect(rect, cornerR, cornerR, bodyPaint)

                  // 3. Top specular highlight
                  val highlightPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(
                          left, top, left, top + shelfH * 0.45f,
                          Color.argb(235, 255, 255, 255),
                          Color.argb(0, 255, 255, 255),
                          Shader.TileMode.CLAMP
                      )
                  }
                  canvas.drawRoundRect(
                      RectF(left + 3f * density, top,
                            right - 3f * density, top + shelfH * 0.55f),
                      cornerR, cornerR, highlightPaint
                  )

                  // 4. Bottom reflection shimmer
                  val reflPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      shader = LinearGradient(
                          left, bottom - shelfH * 0.30f, left, bottom,
                          Color.argb(0, 255, 255, 255),
                          Color.argb(120, 255, 255, 255),
                          Shader.TileMode.CLAMP
                      )
                  }
                  canvas.drawRoundRect(
                      RectF(left + cornerR * 0.5f, bottom - shelfH * 0.30f,
                            right - cornerR * 0.5f, bottom),
                      cornerR * 0.3f, cornerR * 0.3f, reflPaint
                  )

                  // 5. Crisp glass rim outline
                  val rimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = (1f * density).coerceAtLeast(1f)
                      color = Color.argb(160, 255, 255, 255)
                  }
                  canvas.drawRoundRect(rect, cornerR, cornerR, rimPaint)
              }

              fun clearCache() {
                  cachedBitmap?.let { if (!it.isRecycled) it.recycle() }
                  cachedBitmap = null
                  cacheW = 0
                  cacheH = 0
                  cacheDensity = 0f
              }
          }
          ENDOFFILE

      # ── 13. Kotlin: ShelfWidgetProvider ──────────────────────────────────────
      - name: Generate ShelfWidgetProvider.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/ShelfWidgetProvider.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Bundle
          import android.util.Log
          import android.view.View
          import android.widget.RemoteViews
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.launch

          /**
           * Home-screen widget provider for ShelfWidget.
           *
           * Each widget instance (appWidgetId) has its own independent 12-slot assignment
           * stored via ShelfPreferences. Updates run on Dispatchers.IO via goAsync().
           */
          class ShelfWidgetProvider : AppWidgetProvider() {

              companion object {
                  private const val TAG = "ShelfWidgetProvider"
                  const val EXTRA_SLOT_INDEX = "com.example.shelfwidget.EXTRA_SLOT_INDEX"

                  private val SLOT_IDS = intArrayOf(
                      R.id.slot_0,  R.id.slot_1,  R.id.slot_2,
                      R.id.slot_3,  R.id.slot_4,  R.id.slot_5,
                      R.id.slot_6,  R.id.slot_7,  R.id.slot_8,
                      R.id.slot_9,  R.id.slot_10, R.id.slot_11
                  )
                  private val ICON_IDS = intArrayOf(
                      R.id.icon_0,  R.id.icon_1,  R.id.icon_2,
                      R.id.icon_3,  R.id.icon_4,  R.id.icon_5,
                      R.id.icon_6,  R.id.icon_7,  R.id.icon_8,
                      R.id.icon_9,  R.id.icon_10, R.id.icon_11
                  )

                  private const val ICON_DP = 48
              }

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  val pr = goAsync()
                  CoroutineScope(Dispatchers.IO + SupervisorJob()).launch {
                      try {
                          for (id in appWidgetIds) {
                              updateSingleWidget(context, appWidgetManager, id)
                          }
                      } catch (e: Exception) {
                          Log.e(TAG, "onUpdate failed", e)
                      } finally {
                          pr.finish()
                      }
                  }
              }

              override fun onAppWidgetOptionsChanged(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetId: Int,
                  newOptions: Bundle
              ) {
                  ShelfCanvasRenderer.clearCache()
                  val pr = goAsync()
                  CoroutineScope(Dispatchers.IO + SupervisorJob()).launch {
                      try {
                          updateSingleWidget(context, appWidgetManager, appWidgetId)
                      } catch (e: Exception) {
                          Log.e(TAG, "onAppWidgetOptionsChanged failed", e)
                      } finally {
                          pr.finish()
                      }
                  }
              }

              override fun onDeleted(context: Context, appWidgetIds: IntArray) {
                  val prefs = ShelfPreferences(context)
                  for (id in appWidgetIds) {
                      prefs.clearWidget(id)
                      Log.d(TAG, "Cleared preferences for widget $id")
                  }
              }

              override fun onDisabled(context: Context) {
                  ShelfCanvasRenderer.clearCache()
              }

              private fun updateSingleWidget(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetId: Int
              ) {
                  val options = appWidgetManager.getAppWidgetOptions(appWidgetId)
                  val density = context.resources.displayMetrics.density

                  // Defend against launcher returning 0dp on initial placement
                  var widthDp = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH, 0)
                  if (widthDp <= 0) widthDp = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0)
                  if (widthDp <= 0) widthDp = 320

                  var heightDp = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0)
                  if (heightDp <= 0) heightDp = options.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0)
                  if (heightDp <= 0) heightDp = 360

                  val widthPx = (widthDp * density).toInt().coerceIn(60, 2048)
                  val heightPx = (heightDp * density).toInt().coerceIn(60, 2048)
                  val iconSizePx = (ICON_DP * density).toInt().coerceIn(48, 192)

                  val shelfBitmap = ShelfCanvasRenderer.renderShelves(widthPx, heightPx, density)
                  val prefs = ShelfPreferences(context)
                  val assignments = prefs.getAllSlots(appWidgetId)
                  val pm = context.packageManager

                  val views = RemoteViews(context.packageName, R.layout.widget_shelf)
                  views.setImageViewBitmap(R.id.shelf_background, shelfBitmap)

                  for (slotIndex in 0..11) {
                      val slotId = SLOT_IDS[slotIndex]
                      val iconId = ICON_IDS[slotIndex]
                      val packageName = assignments[slotIndex]

                      if (packageName != null) {
                          val iconBitmap = resolveIcon(pm, packageName, iconSizePx)
                          if (iconBitmap != null) {
                              views.setImageViewBitmap(iconId, iconBitmap)
                              views.setViewVisibility(iconId, View.VISIBLE)
                              val launchIntent = pm.getLaunchIntentForPackage(packageName)
                              val pending = if (launchIntent != null) {
                                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  // Unique data URI prevents Intent.filterEquals collisions across widgets & slots
                                  launchIntent.data = Uri.parse("shelfwidget://launch/${appWidgetId}/${slotIndex}")
                                  PendingIntent.getActivity(
                                      context,
                                      appWidgetId * 100 + slotIndex,
                                      launchIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                                  )
                              } else {
                                  buildConfigPendingIntent(context, appWidgetId, slotIndex)
                              }
                              views.setOnClickPendingIntent(slotId, pending)
                          } else {
                              views.setViewVisibility(iconId, View.INVISIBLE)
                              views.setOnClickPendingIntent(
                                  slotId,
                                  buildConfigPendingIntent(context, appWidgetId, slotIndex)
                              )
                          }
                      } else {
                          views.setViewVisibility(iconId, View.INVISIBLE)
                          views.setOnClickPendingIntent(
                              slotId,
                              buildConfigPendingIntent(context, appWidgetId, slotIndex)
                          )
                      }
                  }

                  appWidgetManager.updateAppWidget(appWidgetId, views)
              }

              private fun resolveIcon(pm: PackageManager, packageName: String, sizePx: Int): Bitmap? {
                  return try {
                      val ai = pm.getApplicationInfo(packageName, 0)
                      drawableToBitmap(pm.getApplicationIcon(ai), sizePx)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun drawableToBitmap(drawable: Drawable, size: Int): Bitmap {
                  if (drawable is BitmapDrawable && drawable.bitmap != null && !drawable.bitmap.isRecycled) {
                      return Bitmap.createScaledBitmap(drawable.bitmap, size, size, true)
                  }
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  drawable.setBounds(0, 0, size, size)
                  drawable.draw(canvas)
                  return bmp
              }

              private fun buildConfigPendingIntent(
                  context: Context, appWidgetId: Int, slotIndex: Int
              ): PendingIntent {
                  val intent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      data = Uri.parse("shelfwidget://config/${appWidgetId}/${slotIndex}")
                      putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                      putExtra(EXTRA_SLOT_INDEX, slotIndex)
                  }
                  return PendingIntent.getActivity(
                      context,
                      appWidgetId * 100 + slotIndex,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
              }
          }
          ENDOFFILE

      # ── 14. Kotlin: MainActivity ──────────────────────────────────────────────
      - name: Generate MainActivity.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/MainActivity.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          /**
           * Companion configuration and management activity for ShelfWidget.
           *
           * Supports both:
           * 1. Direct launch from App Drawer with instance selector.
           * 2. Widget placement configuration flow (ACTION_APPWIDGET_CONFIGURE).
           */
          class MainActivity : AppCompatActivity() {

              private var configWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID
              private var activeWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID
              private var pendingSlotIndex = -1

              private lateinit var prefs: ShelfPreferences
              private lateinit var noWidgetText : TextView
              private lateinit var widgetSpinner: Spinner
              private lateinit var slotSection  : View
              private lateinit var applyButton  : Button

              private val cardViews = mutableListOf<View>()
              private val iconViews = mutableListOf<ImageView>()
              private val nameViews = mutableListOf<TextView>()

              private val pickerLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK) {
                      val pkg = result.data?.getStringExtra(AppPickerActivity.EXTRA_PACKAGE_NAME)
                      if (pkg != null && pendingSlotIndex in 0..11
                          && activeWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                          prefs.saveAppToSlot(activeWidgetId, pendingSlotIndex, pkg)
                          refreshSlotDisplay()
                      }
                  }
                  pendingSlotIndex = -1
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  supportActionBar?.title = getString(R.string.app_name_full)

                  prefs = ShelfPreferences(this)

                  configWidgetId = intent.getIntExtra(
                      AppWidgetManager.EXTRA_APPWIDGET_ID,
                      AppWidgetManager.INVALID_APPWIDGET_ID
                  )
                  // Default cancellation result per Android documentation
                  if (configWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                      setResult(RESULT_CANCELED, Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, configWidgetId))
                  }

                  noWidgetText  = findViewById(R.id.no_widget_text)
                  widgetSpinner = findViewById(R.id.widget_spinner)
                  slotSection   = findViewById(R.id.slot_section)
                  applyButton   = findViewById(R.id.apply_button)

                  val cardIds = intArrayOf(
                      R.id.slot_card_0,  R.id.slot_card_1,  R.id.slot_card_2,
                      R.id.slot_card_3,  R.id.slot_card_4,  R.id.slot_card_5,
                      R.id.slot_card_6,  R.id.slot_card_7,  R.id.slot_card_8,
                      R.id.slot_card_9,  R.id.slot_card_10, R.id.slot_card_11
                  )
                  val iconIds = intArrayOf(
                      R.id.slot_icon_0,  R.id.slot_icon_1,  R.id.slot_icon_2,
                      R.id.slot_icon_3,  R.id.slot_icon_4,  R.id.slot_icon_5,
                      R.id.slot_icon_6,  R.id.slot_icon_7,  R.id.slot_icon_8,
                      R.id.slot_icon_9,  R.id.slot_icon_10, R.id.slot_icon_11
                  )
                  val nameIds = intArrayOf(
                      R.id.slot_name_0,  R.id.slot_name_1,  R.id.slot_name_2,
                      R.id.slot_name_3,  R.id.slot_name_4,  R.id.slot_name_5,
                      R.id.slot_name_6,  R.id.slot_name_7,  R.id.slot_name_8,
                      R.id.slot_name_9,  R.id.slot_name_10, R.id.slot_name_11
                  )

                  for (i in 0..11) {
                      val card = findViewById<View>(cardIds[i])
                      val icon = card.findViewById<ImageView>(iconIds[i])
                      val name = card.findViewById<TextView>(nameIds[i])
                      cardViews.add(card)
                      iconViews.add(icon)
                      nameViews.add(name)
                      val idx = i
                      card.setOnClickListener     { openPickerForSlot(idx) }
                      card.setOnLongClickListener { clearSlot(idx); true   }
                  }

                  applyButton.setOnClickListener { applyAndRefresh() }
                  populateWidgetSpinner()

                  val initialSlot = intent.getIntExtra(ShelfWidgetProvider.EXTRA_SLOT_INDEX, -1)
                  if (initialSlot in 0..11 && activeWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                      openPickerForSlot(initialSlot)
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID)
                  if (widgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                      configWidgetId = widgetId
                      activeWidgetId = widgetId
                      populateWidgetSpinner()
                  }
                  val initialSlot = intent.getIntExtra(ShelfWidgetProvider.EXTRA_SLOT_INDEX, -1)
                  if (initialSlot in 0..11 && activeWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                      openPickerForSlot(initialSlot)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  populateWidgetSpinner()
              }

              private fun populateWidgetSpinner() {
                  val awm = AppWidgetManager.getInstance(this)
                  val cn  = ComponentName(this, ShelfWidgetProvider::class.java)
                  val ids = awm.getAppWidgetIds(cn).toMutableList()

                  if (configWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID
                      && !ids.contains(configWidgetId)) {
                      ids.add(0, configWidgetId)
                  }

                  if (ids.isEmpty()) {
                      noWidgetText.visibility  = View.VISIBLE
                      widgetSpinner.visibility = View.GONE
                      slotSection.visibility   = View.GONE
                      applyButton.visibility   = View.GONE
                      activeWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID
                      return
                  }

                  noWidgetText.visibility  = View.GONE
                  widgetSpinner.visibility = View.VISIBLE
                  slotSection.visibility   = View.VISIBLE
                  applyButton.visibility   = View.VISIBLE

                  val labels = ids.mapIndexed { i, id -> "Widget ${i + 1}  (ID $id)" }
                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item, labels)
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  widgetSpinner.adapter = adapter

                  val sel = if (configWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                      val idx = ids.indexOf(configWidgetId)
                      if (idx >= 0) idx else 0
                  } else {
                      val curIdx = ids.indexOf(activeWidgetId)
                      if (curIdx >= 0) curIdx else 0
                  }

                  widgetSpinner.setSelection(sel)
                  activeWidgetId = ids[sel]
                  refreshSlotDisplay()

                  widgetSpinner.onItemSelectedListener =
                      object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                              activeWidgetId = ids[pos]
                              refreshSlotDisplay()
                          }
                          override fun onNothingSelected(p: AdapterView<*>?) {}
                      }
              }

              private fun refreshSlotDisplay() {
                  if (activeWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) return
                  val pm = packageManager
                  for (i in 0..11) {
                      val pkg = prefs.getAppForSlot(activeWidgetId, i)
                      if (pkg != null) {
                          try {
                              val ai = pm.getApplicationInfo(pkg, 0)
                              val icon = pm.getApplicationIcon(ai)
                              val label = pm.getApplicationLabel(ai).toString()
                              iconViews[i].setImageDrawable(icon)
                              iconViews[i].visibility = View.VISIBLE
                              nameViews[i].text = label
                          } catch (e: Exception) {
                              iconViews[i].setImageResource(android.R.drawable.ic_dialog_alert)
                              iconViews[i].visibility = View.VISIBLE
                              nameViews[i].text = getString(R.string.slot_missing_app)
                          }
                      } else {
                          iconViews[i].setImageDrawable(null)
                          iconViews[i].visibility = View.INVISIBLE
                          nameViews[i].text = getString(R.string.slot_empty_hint)
                      }
                  }
              }

              private fun openPickerForSlot(slotIndex: Int) {
                  if (activeWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) return
                  pendingSlotIndex = slotIndex
                  pickerLauncher.launch(Intent(this, AppPickerActivity::class.java))
              }

              private fun clearSlot(slotIndex: Int) {
                  if (activeWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) return
                  prefs.clearSlot(activeWidgetId, slotIndex)
                  refreshSlotDisplay()
                  Toast.makeText(this, getString(R.string.slot_cleared), Toast.LENGTH_SHORT).show()
              }

              private fun applyAndRefresh() {
                  if (activeWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) return

                  // Explicit broadcast guarantees delivery across Android versions & Xiaomi HyperOS
                  val intent = Intent(AppWidgetManager.ACTION_APPWIDGET_UPDATE).apply {
                      component = ComponentName(this@MainActivity, ShelfWidgetProvider::class.java)
                      putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, intArrayOf(activeWidgetId))
                  }
                  sendBroadcast(intent)

                  if (configWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID
                      && configWidgetId == activeWidgetId) {
                      val resultValue = Intent().apply {
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, configWidgetId)
                      }
                      setResult(RESULT_OK, resultValue)
                      finish()
                  } else {
                      Toast.makeText(this, getString(R.string.widget_updated), Toast.LENGTH_SHORT).show()
                  }
              }
          }
          ENDOFFILE

