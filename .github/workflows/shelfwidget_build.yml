      - name: Generate AppPickerAdapter.kt
        run: |
          cat > app/src/main/kotlin/com/example/shelfwidget/AppPickerAdapter.kt << 'ENDOFFILE'
          package com.example.shelfwidget

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class AppPickerAdapter(
              private val onAppSelected: (AppInfo) -> Unit
          ) : RecyclerView.Adapter<AppPickerAdapter.ViewHolder>() {

              private val allApps      = mutableListOf<AppInfo>()
              private val filteredApps = mutableListOf<AppInfo>()

              fun submitList(apps: List<AppInfo>) {
                  allApps.clear()
                  allApps.addAll(apps)
                  filter("")
              }

              fun filter(query: String) {
                  filteredApps.clear()
                  if (query.isBlank()) {
                      filteredApps.addAll(allApps)
                  } else {
                      val q = query.trim().lowercase()
                      filteredApps.addAll(allApps.filter {
                          it.name.lowercase().contains(q) ||
                              it.packageName.lowercase().contains(q)
                      })
                  }
                  notifyDataSetChanged()
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                  val view = LayoutInflater.from(parent.context)
                      .inflate(R.layout.item_app, parent, false)
                  return ViewHolder(view)
              }

              override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                  val app = filteredApps[position]
                  holder.icon.setImageDrawable(app.icon)
                  holder.name.text = app.name
                  holder.pkg.text  = app.packageName
                  holder.itemView.setOnClickListener { onAppSelected(app) }
              }

              override fun getItemCount() = filteredApps.size

              class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                  val icon: ImageView = view.findViewById(R.id.app_icon)
                  val name: TextView  = view.findViewById(R.id.app_name)
                  val pkg : TextView  = view.findViewById(R.id.app_package)
              }
          }
          ENDOFFILE

